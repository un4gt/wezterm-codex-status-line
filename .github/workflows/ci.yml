name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"

      - name: Sync package assets
        run: node scripts/sync-package-assets.mjs

      - name: Bridge tests
        run: python -m unittest tests.test_bridge tests.test_lifecycle_log -v

      - name: Lua tests
        shell: bash
        run: |
          npx --yes --package=fengari-node-cli fengari tests/core_test.lua
          npx --yes --package=fengari-node-cli fengari tests/statusline_lifecycle_test.lua
          npx --yes --package=fengari-node-cli fengari tests/statusline_scenario_test.lua
          npx --yes --package=fengari-node-cli fengari tests/statusline_resume_test.lua

      - name: npm CLI
        working-directory: packages/npm
        run: npm ci && npm run typecheck && npm test && npm run build

      - name: Pack npm CLI
        working-directory: packages/npm
        run: npm pack --ignore-scripts

      - name: Python CLI
        working-directory: packages/python
        run: uv sync --frozen && uv run python -m unittest discover -s tests -v && uv build

      - name: Verify package assets
        run: python scripts/verify-package-assets.py

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run typecheck && npm run build
