name: Release packages

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - name: Verify tag and package versions
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Publishing requires a version tag such as v0.1.1."
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./packages/npm/package.json').version")"
          test "$version" = "$(grep '^version = ' packages/python/pyproject.toml | cut -d '"' -f 2)"
          test -f "release-notes/${GITHUB_REF_NAME}.md"
      - run: node scripts/sync-package-assets.mjs
      - working-directory: packages/npm
        run: npm ci && npm pack
      - working-directory: packages/python
        run: uv sync --frozen && uv run python -m unittest discover -s tests -v && uv build
      - name: Verify package assets
        run: python3 scripts/verify-package-assets.py
      - name: Test remote package installation
        run: python3 scripts/test_remote_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            packages/npm/*.tgz
            packages/python/dist/*

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wezterm-codex-status-line
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/dist/

  publish-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/wezterm-codex-status-line
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Publish to npm with trusted publishing
        run: npm publish dist/npm/*.tgz --access public --provenance

  github-release:
    needs: [build, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/npm/*.tgz
            dist/python/dist/*.whl
            dist/python/dist/*.tar.gz
