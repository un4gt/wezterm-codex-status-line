name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_registries:
        description: "Publish the selected version tag to npm and PyPI (requires trusted publishers)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  NPM_VERSION: "11.7.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - name: Use npm with trusted publishing support
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - name: Verify tag and package versions
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "Select a version tag, such as v0.1.0, to release."; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./packages/npm/package.json').version")"
          test "$version" = "$(grep '^version = ' packages/python/pyproject.toml | cut -d '"' -f 2)"
          test -f "release-notes/${GITHUB_REF_NAME}.md"
      - run: node scripts/sync-package-assets.mjs
      - working-directory: packages/npm
        run: npm ci && npm pack
      - working-directory: packages/python
        run: uv build
      - name: Verify package assets
        run: python3 scripts/verify-package-assets.py
      - name: Test remote package installation
        run: python3 scripts/test_remote_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            packages/npm/*.tgz
            packages/python/dist/*

  publish-npm:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_registries
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm publish dist/npm/*.tgz --access public --provenance

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_registries
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/dist/

  github-release:
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success'
          && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
          && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    needs: [build, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes/${{ github.ref_name }}.md
          prerelease: ${{ inputs.publish_registries != true || contains(github.ref_name, '-') }}
          make_latest: ${{ inputs.publish_registries == true && !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/npm/*.tgz
            dist/python/dist/*.whl
            dist/python/dist/*.tar.gz
